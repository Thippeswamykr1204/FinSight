# FinSight Render Blueprint (Singapore).
# Topology: finsight-web (public) -> finsight-api (PRIVATE) -> MongoDB Atlas + finsight-redis.
# The API is never exposed publicly; the web app proxies /api/identity and /api/v1
# (including the billing webhook) over Render's private network.
#
# BEFORE first sync, create the env group "finsight-api-runtime" with the values listed
# in docs/DEPLOYMENT.md#render (Render has no sync:false inside groups).

services:
  - type: keyvalue
    name: finsight-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction # required by BullMQ
    ipAllowList: [] # private network only

  - type: pserv
    name: finsight-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    region: singapore
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 35
    envVars:
      - fromGroup: finsight-api-runtime
      - key: NODE_ENV
        value: production
      - key: HOSTED_LOCAL
        value: "false"
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "4000"
      - key: API_ORIGIN
        value: http://finsight-api:4000
      # Render private-network peers (the web service). Verify with a spoofed
      # X-Forwarded-For request after first deploy (see docs/DEPLOYMENT.md#proxy-trust-and-rate-limits).
      - key: TRUSTED_PROXY
        value: 10.0.0.0/8
      - key: LOG_LEVEL
        value: info
      - key: TZ
        value: Asia/Kolkata
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: finsight-redis
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_RELEASE
        sync: false

  - type: worker
    name: finsight-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerCommand: node apps/api/dist/worker.js
    region: singapore
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 35
    envVars:
      - fromGroup: finsight-api-runtime
      - key: NODE_ENV
        value: production
      - key: HOSTED_LOCAL
        value: "false"
      - key: API_ORIGIN
        value: http://finsight-api:4000
      - key: LOG_LEVEL
        value: info
      - key: TZ
        value: Asia/Kolkata
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: finsight-redis
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_RELEASE
        sync: false

  - type: web
    name: finsight-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    healthCheckPath: /api/ready # proxies the API's /ready, so it covers the whole chain
    region: singapore
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 35
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: http://finsight-api:4000
      # Public https origin, e.g. https://finsight.yourdomain.com. Needed at BUILD time.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: GRIEVANCE_OFFICER_NAME
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_RELEASE
        sync: false

envVarGroups:
  - name: finsight-api-runtime
    envVars:
      # Generated once, shared by API + worker.
      - key: BETTER_AUTH_SECRET
        generateValue: true