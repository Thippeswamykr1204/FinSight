name: Bug report
description: Report a reproducible problem with FinSight.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, personal data, and customer records before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: List the smallest set of steps that reliably reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the browser, operating system, or deployment context.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets, tokens, personal data, and customer records.
