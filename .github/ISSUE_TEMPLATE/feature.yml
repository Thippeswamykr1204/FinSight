name: Feature request
description: Suggest a focused improvement to FinSight.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, or customer records.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user problem and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional
    attributes:
      label: Additional context
