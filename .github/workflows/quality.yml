name: Quality
on:
  pull_request:
  push:
    branches: [main, rebuild/v2, feat/india-inr, chore/portfolio-cleanup]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:api
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run env:init
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:4000/ready
      - run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/api/ready
      - if: always()
        run: docker compose down -v
