name: finsight-production

# Shared runtime hardening for every service.
x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 35s
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the HTTPS web origin}
        VERSION: ${FINSIGHT_VERSION:-dev}
        REVISION: ${FINSIGHT_REVISION:-unknown}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the HTTPS web origin}
      API_URL: http://api:4000
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:?Set the operator contact}
      GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:?Set the grievance officer}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports: ["127.0.0.1:${FINSIGHT_WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        VERSION: ${FINSIGHT_VERSION:-dev}
        REVISION: ${FINSIGHT_REVISION:-unknown}
    env_file: .env
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      NODE_ENV: production
      HOSTED_LOCAL: "false"
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?Set the HTTPS web origin}
      API_ORIGIN: ${API_ORIGIN:?Set the HTTPS API origin}
      MONGODB_URI: ${MONGODB_URI:?Set an authenticated managed replica-set URI}
      REDIS_URL: ${REDIS_URL:?Set an authenticated managed Redis URI}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate an authentication secret}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Generate a field encryption key}
      SMTP_HOST: ${SMTP_HOST:?Set the transactional SMTP host}
      SMTP_PORT: ${SMTP_PORT:?Set the transactional SMTP port}
      EMAIL_FROM: ${EMAIL_FROM:?Set the verified sender}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:?Set the operator contact}
      GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:?Set the grievance officer}
    expose: ["4000"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
  worker:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        VERSION: ${FINSIGHT_VERSION:-dev}
        REVISION: ${FINSIGHT_REVISION:-unknown}
    env_file: .env
    read_only: true
    tmpfs: ["/tmp"]
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      HOSTED_LOCAL: "false"
      WEB_ORIGIN: ${WEB_ORIGIN:?Set the HTTPS web origin}
      API_ORIGIN: ${API_ORIGIN:?Set the HTTPS API origin}
      MONGODB_URI: ${MONGODB_URI:?Set an authenticated managed replica-set URI}
      REDIS_URL: ${REDIS_URL:?Set an authenticated managed Redis URI}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate an authentication secret}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Generate a field encryption key}
      SMTP_HOST: ${SMTP_HOST:?Set the transactional SMTP host}
      SMTP_PORT: ${SMTP_PORT:?Set the transactional SMTP port}
      EMAIL_FROM: ${EMAIL_FROM:?Set the verified sender}
    healthcheck:
      test: ["CMD", "node", "apps/api/dist/worker-health.js"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
